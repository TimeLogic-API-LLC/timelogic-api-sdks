    DstExample:
      summary: DST status with next transition
      value:
        unix: 1776274247
        unix_ms: 1776274247883
        utc: '2026-04-15T17:30:47Z'
        iso_local: '2026-04-15T13:30:47-04:00'
        rfc2822: Wed, 15 Apr 2026 13:30:47 -0400
        human: April 15, 2026, 1:30 PM America/New_York
        day_number: 4
        day_short: Wed
        day_full: Wednesday
        timezone: America/New_York
        dst_active: true
        next_transition: '2026-11-01T02:00:00-04:00'
    ClockDigitalHtmlExample:
      summary: Abbreviated digital clock HTML fragment
      value: '<div class="timelogic-clock-host" data-timelogic-clock></div><script type="application/json">{"version":"v1","style":"digital-dashboard","unix_ms":1776274247883,"timezone_label":"America/New_York","refresh":{"path":"https://api.timelogicapi.com/v1/time/current","selector":{"kind":"tz","tz":"America/New_York"}}}</script><link rel="stylesheet" href="https://api.timelogicapi.com/v1/time/clock/assets/v1/clock.css"><script src="https://api.timelogicapi.com/v1/time/clock/assets/v1/clock.js"></script>'
    ClockAnalogHtmlExample:
      summary: Abbreviated analog clock HTML fragment
      value: '<div class="timelogic-clock-host" data-timelogic-clock></div><script type="application/json">{"version":"v1","style":"analog-station","unix_ms":1776274247883,"timezone_label":"UTC","refresh":{"path":"https://api.timelogicapi.com/v1/time/current","selector":{"kind":"none"}}}</script><link rel="stylesheet" href="https://api.timelogicapi.com/v1/time/clock/assets/v1/clock.css"><script src="https://api.timelogicapi.com/v1/time/clock/assets/v1/clock.js"></script>'
    ElapsedExample:
      summary: Remaining duration with business-day count
      value:
        seconds: 172800
        minutes: 2880
        hours: 48
        days: 2
        human: 2 days left
        direction: left
        formatted: 2d 0h 0m 0s
        business_days: 2
    TimezoneResolvedExample:
      summary: Resolved timezone payload
      value:
        unix: 1776274247
        unix_ms: 1776274247883
        utc: '2026-04-15T17:30:47Z'
        iso_local: '2026-04-15T13:30:47-04:00'
        rfc2822: Wed, 15 Apr 2026 13:30:47 -0400
        human: April 15, 2026, 1:30 PM America/New_York
        day_number: 4
        day_short: Wed
        day_full: Wednesday
        timezone: America/New_York
