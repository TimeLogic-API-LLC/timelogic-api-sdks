          alg: EdDSA
          use: sig
          kid: ed25519-2026-07-19
          key_ops:
          - verify
          ext: true
          x: LUuZFwpGBGvPS-4vJdLM21_IreJqea-aoyXRhGfH3dI
    JwksSingleKeyExample:
      summary: Current `kid`-filtered JWKS response
      value:
        keys:
        - kty: OKP
          crv: Ed25519
          alg: EdDSA
          use: sig
          kid: ed25519-2026-07-19
          key_ops:
          - verify
          ext: true
          x: LUuZFwpGBGvPS-4vJdLM21_IreJqea-aoyXRhGfH3dI
