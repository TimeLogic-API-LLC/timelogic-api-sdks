components:
  securitySchemes:
    directBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: TimeLogic API key
      description: 'Direct API key supplied as Authorization: Bearer.'
    directApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Direct API key supplied as X-API-Key.'
    directApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: Direct API key supplied as a query parameter; headers are preferred.
    rapidApiKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: RapidAPI subscription key. The SDK rapidApi option accepts this key.
    rapidApiHost:
      type: apiKey
      in: header
      name: X-RapidAPI-Host
      description: RapidAPI gateway host header. SDKs supply the configured host automatically.
  headers:
    XRequestId:
      description: Gateway-generated or forwarded request identifier.
      schema:
        type: string
      example: f3eb6ec5-77a8-454f-8b6a-5c68aabe7abb
    XTimeLogicSignature:
      description: Base64 Ed25519 detached signature for signed JSON responses.
      schema:
        type: string
      example: vbk1uI/2SaHwARiXyoZye4CG4OM4MG0NNqFfwZ4WzAQFdAYupZ0S6JT0KUzdc7/1PD5vtLLgQJFbM1+vUvD4CQ==
    XTimeLogicKeyId:
      description: On signed responses, the signing key `kid` used for `X-TimeLogic-Signature`.
        On unsigned authenticated responses, the ID of the API key that made the request.
      schema:
        type: string
      example: ed25519-2026-07-19
    XTimeLogicSignatureAlg:
      description: Signature algorithm.
      schema:
        type: string
        enum:
        - Ed25519
      example: Ed25519
    XTimeLogicSignatureTimestamp:
      description: UNIX seconds used in the signing envelope.
      schema:
        type: string
        pattern: ^-?\d+$
      example: '1776274247'
    XTimeLogicSignatureInput:
      description: Base64URL-encoded exact UTF-8 v1 signing input. Decode this value and verify X-TimeLogic-Signature over the decoded bytes; it includes the signed path and query, including sign=true, and deliberately excludes scheme, host, and Content-Type.
      schema:
        type: string
    XAuthMode:
      description: How the request was authenticated (`api_key`).
      schema:
        type: string
      example: api_key
    XTimeLogicCustomerId:
      description: Authenticated customer identifier.
      schema:
        type: string
    XTimeLogicPlan:
      description: Authenticated customer plan.
      schema:
        type: string
    XTimeLogicQuotaLimit:
      description: Requests included per month, or `unlimited`. There is no remaining-requests
        or reset header; the quota period is the UTC calendar month.
      schema:
        type: string
    XTimeLogicQuotaState:
      description: Cached quota state.
      schema:
        type: string
        enum: [active, exceeded]
    XTimeLogicContentSha256:
      description: Standard Base64 SHA-256 hash of the exact UTF-8 JSON response
        body bytes.
      schema:
        type: string
      example: bP2ZOTQo23TTmTlt3RkxPk82gAZ5GpeWogsxgOhRAkg=
  parameters:
    SignFlag:
      name: sign
      in: query
      description: Set to `true`, `1` or `yes` (case-insensitive) to ask the gateway to sign the final JSON response. Any other value, a bare `sign`, or repeated `sign` values leave the response unsigned.
        Every authenticated JSON response, including errors, then includes signing headers.
        Not supported on `/v1/time/clock`.
      required: false
      schema:
        type: boolean
      example: true
    Format:
      name: format
      in: query
      description: 'Custom date/time format template using supported `strftime`-style
        directives such as `%Y-%m-%d %H:%M:%S`. Supported directives: `%a %A %b %B
        %C %d %D %e %F %h %H %I %j %k %l %m %M %n %p %P %r %R %s %S %t %T %u %v %w %x
        %X %y %Y %z %:z %Z %%`, with the `-`, `_` and `0` padding flags on numeric directives.
        `%Z` prints the IANA zone name (or `UTC+HH:MM` for an offset target, `UTC`
        with no target), not an abbreviation. Any other directive (for example `%U`,
        `%f`, `%Q`) or a trailing `%` returns 400 INVALID_PARAMETER naming the directive.'
      required: false
      schema:
        type: string
      example: '%Y-%m-%d %H:%M:%S'
    DurationFormat:
      name: format
      in: query
      description: Custom duration format template using `%days`, `%hours`, `%minutes`,
        and `%seconds`. Each placeholder is the total duration in that unit, not a remainder
        (118 days renders `%days days %hours hours` as `118 days 2832 hours`).
      required: false
      schema:
        type: string
      example: '%daysd %hoursh %minutesm %secondss'
    TzSelector:
      name: tz
      in: query
      description: IANA timezone name, matched case-insensitively. Links and aliases resolve
        to their canonical zone, so the returned `timezone` can differ (`Europe/Stockholm`
        returns `Europe/Berlin`, `UTC` returns `Etc/UTC`). `Etc/GMT+5` is UTC-05:00 (POSIX
        sign). On bulk-capable routes, a comma-separated list enables bulk mode with at most
        10 values (any comma, even a trailing one, returns an array); request URLs are limited
        to 8192 characters. On single-target routes a list is rejected as an invalid timezone.
      required: false
      schema:
        type: string
        maxLength: 64
      example: America/New_York
    TzBulkSelector:
      name: tz
      in: query
      description: IANA timezone name, matched case-insensitively. Links and aliases resolve
        to their canonical zone, so the returned `timezone` can differ (`Europe/Stockholm`
        returns `Europe/Berlin`, `UTC` returns `Etc/UTC`). `Etc/GMT+5` is UTC-05:00 (POSIX
        sign). On bulk-capable routes, a comma-separated list enables bulk mode with at most
        10 values (any comma, even a trailing one, returns an array); request URLs are limited
        to 8192 characters. On single-target routes a list is rejected as an invalid timezone.
      required: false
      schema:
        type: string
        description: One IANA timezone name, or a comma-separated list of at most 10 of
          them. An invalid name in a list comes back as a per-item error.
      example: America/New_York
    IpSelector:
      name: ip
      in: query
      description: IP address. On bulk-capable routes, a comma-separated list enables
        bulk mode with at most 10 values; request URLs are limited to 8192 characters.
      required: false
      schema:
        type: string
      example: 8.8.8.8
    LatSelector:
      name: lat
      in: query
      description: Latitude. Must be provided together with `lon`.
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 40.7128
    LonSelector:
      name: lon
      in: query
      description: Longitude. Must be provided together with `lat`.
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: -74.006
    OffsetSelector:
      name: offset
      in: query
      description: Fixed UTC offset in `+HH:MM` or `-HH:MM` format only (`+0530` and
        `+5` are rejected); URL-encode `+` as `%2B`, since an unencoded `+` is read as a space.
        An offset target returns `timezone=null`. On bulk-capable
        routes, a comma-separated list enables bulk mode with at most 10 values; request URLs are limited to 8192 characters.
      required: false
      schema:
        type: string
        pattern: ^[+-](0\d|1\d|2[0-3]):[0-5]\d$
      example: -04:00
    OffsetBulkSelector:
      name: offset
      in: query
      description: Fixed UTC offset in `+HH:MM` or `-HH:MM` format only (`+0530` and
        `+5` are rejected); URL-encode `+` as `%2B`, since an unencoded `+` is read as a space.
        An offset target returns `timezone=null`. On bulk-capable
        routes, a comma-separated list enables bulk mode with at most 10 values; request URLs are limited to 8192 characters.
      required: false
      schema:
        type: string
        description: One `+HH:MM` or `-HH:MM` offset, or a comma-separated list of at most
          10 of them. A malformed value in a list comes back as a per-item error.
      example: -04:00
    AutoTzSelector:
      name: auto_tz
      in: query
      description: Set to `true` to resolve using the caller IP from Cloudflare headers. Counts
        as a selector family, so it cannot be combined with `tz`, `ip`, `lat`/`lon` or `offset`.
        Not supported on `/v1/time/clock`. Enabled by `true`, `1` or `yes` (case-insensitive); any other value leaves it off without an error.
      required: false
      schema:
        type: boolean
      example: true
    UtcFlag:
      name: utc
      in: query
      description: Set to `true` to force UTC on routes that support it. Counts as a target and
        cannot be combined with other selectors (the AMBIGUOUS_TARGET message lists only the
        selector families). The response then has `iso_local=null` and `timezone=null`. Enabled by `true`, `1` or `yes` (case-insensitive); any other value leaves it off without an error.
      required: false
      schema:
        type: boolean
      example: true
    Unix:
      name: unix
      in: query
      description: Whole Unix seconds (fractions are rejected; negative values are allowed). Valid range is -62135596800 to 253402300799 (0001-01-01T00:00:00Z to 9999-12-31T23:59:59Z); values outside it return 400 INVALID_TIMESTAMP.
      required: false
      schema:
        type: integer
        format: int64
      example: 1711300000
    UnixMs:
      name: unix_ms
      in: query
      description: Whole Unix milliseconds. Valid range -62135596800000 to 253402300799999
        (0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999Z); values outside it return 400 INVALID_TIMESTAMP.
      required: false
      schema:
        type: integer
        format: int64
      example: 1711300000000
    Iso:
      name: iso
      in: query
      description: ISO-8601 timestamp. To supply a local wall-clock time without an
        explicit offset, pair it with one of `source_tz=Area/City`, `source_ip=...`,
        `source_lat=...&source_lon=...`, or `source_offset=±HH:MM`; without a hint a local
        value is read as UTC. Accepted shapes are extended format with `Z`, `±HH:MM` or `±HH:MM:SS`
        (for example `1900-06-01T12:09:21+00:09:21`, as `iso_local` prints old local-mean-time offsets),
        optional fractional seconds, a space instead of `T`, a local time, or a date alone
        (read as 00:00). Basic format and offsets without a colon are rejected. The date must
        exist (`2027-02-29` returns 400 INVALID_TIMESTAMP rather than rolling over), and the
        instant must fall between 0001-01-01T00:00:00Z and 9999-12-31T23:59:59Z. A local
        time inside a spring-forward gap returns 400 INVALID_TIMESTAMP; an ambiguous
        fall-back time resolves to its first occurrence.
      required: false
      schema:
        type: string
      example: '2024-03-24T15:00:00'
    SourceTz:
      name: source_tz
      in: query
      description: Used only with `iso=...` when the ISO value has no explicit offset.
      required: false
      schema:
        type: string
      example: America/New_York
    SourceIp:
      name: source_ip
      in: query
      description: Used only with `iso=...` when the ISO value has no explicit offset.
        Resolves that local wall-clock time through the timezone mapped from this IP address.
      required: false
      schema:
        type: string
      example: 8.8.8.8
    SourceLat:
      name: source_lat
      in: query
      description: Used only with `iso=...` when the ISO value has no explicit offset.
        Provide together with `source_lon` to resolve that local wall-clock time through
        the timezone mapped from these coordinates.
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 40.7128
    SourceLon:
      name: source_lon
      in: query
      description: Used only with `iso=...` when the ISO value has no explicit offset.
        Provide together with `source_lat`.
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: -74.006
    SourceOffset:
      name: source_offset
      in: query
      description: Used only with `iso=...` when the ISO value has no explicit offset.
        Interprets that local wall-clock time at this fixed UTC offset.
      required: false
      schema:
        type: string
        pattern: ^[+-](0\d|1\d|2[0-3]):[0-5]\d$
      example: -05:00
    CompareUnix:
      name: compare_unix
      in: query
      required: false
      schema:
        type: integer
        format: int64
      example: 1711213600
    CompareUnixMs:
      name: compare_unix_ms
      in: query
      required: false
      schema:
        type: integer
        format: int64
      example: 1711213600000
    CompareIso:
      name: compare_iso
      in: query
      description: ISO-8601 comparison timestamp. To supply a local wall-clock time
        without an explicit offset, pair it with one of `compare_source_tz=Area/City`,
        `compare_source_ip=...`, `compare_source_lat=...&compare_source_lon=...`,
        or `compare_source_offset=±HH:MM`.
      required: false
      schema:
        type: string
      example: '2024-03-23T15:00:00'
    CompareSourceTz:
      name: compare_source_tz
      in: query
      description: Used only with `compare_iso=...` when the ISO value has no explicit
        offset.
      required: false
      schema:
        type: string
      example: America/New_York
    CompareSourceIp:
      name: compare_source_ip
      in: query
      description: Used only with `compare_iso=...` when the ISO value has no explicit
        offset. Resolves that local wall-clock time through the timezone mapped from this IP address.
      required: false
      schema:
        type: string
      example: 8.8.8.8
    CompareSourceLat:
      name: compare_source_lat
      in: query
      description: Used only with `compare_iso=...` when the ISO value has no explicit
        offset. Provide together with `compare_source_lon` to resolve that local wall-clock time through the timezone mapped from these coordinates.
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 40.7128
    CompareSourceLon:
      name: compare_source_lon
      in: query
      description: Used only with `compare_iso=...` when the ISO value has no explicit
        offset. Provide together with `compare_source_lat`.
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: -74.006
    CompareSourceOffset:
      name: compare_source_offset
      in: query
      description: Used only with `compare_iso=...` when the ISO value has no explicit
        offset. Interprets that local wall-clock time at this fixed UTC offset.
      required: false
      schema:
        type: string
        pattern: ^[+-](0\d|1\d|2[0-3]):[0-5]\d$
      example: -05:00
    FromSpecifier:
      name: from
      in: query
      description: "Time specifier. Supported forms are `now`, `unix=<seconds>`, `unix_ms=<milliseconds>`,\
        \ `iso=<ISO-8601>`, `offset=\xB1HH:MM`, `tz=<IANA timezone>`, and `ip=<IP\
        \ address>`. For `tz=...`, `ip=...`, and `offset=...`, the specifier means\
        \ the current request-time instant resolved through that selector. To express\
        \ a local wall-clock time, use `from=iso=...` together with one of `from_tz`,\
        \ `from_ip`, `from_lat`+`from_lon`, or `from_offset`."
      required: true
      schema:
        type: string
    ToSpecifier:
      name: to
      in: query
      description: "Time specifier. Supported forms are `now`, `unix=<seconds>`, `unix_ms=<milliseconds>`,\
        \ `iso=<ISO-8601>`, `offset=\xB1HH:MM`, `tz=<IANA timezone>`, and `ip=<IP\
        \ address>`. For `tz=...`, `ip=...`, and `offset=...`, the specifier means\
        \ the current request-time instant resolved through that selector. To express\
        \ a local wall-clock time, use `to=iso=...` together with one of `to_tz`,\
        \ `to_ip`, `to_lat`+`to_lon`, or `to_offset`."
      required: true
      schema:
        type: string
    FromTz:
      name: from_tz
      in: query
      description: Used only with `from=iso=...` when the ISO value has no explicit
        offset.
      required: false
      schema:
        type: string
    FromIp:
      name: from_ip
      in: query
      description: Used only with `from=iso=...` when the ISO value has no explicit
        offset. Resolves that local wall-clock time through the timezone mapped from this IP address.
      required: false
      schema:
        type: string
      example: 8.8.8.8
    FromLat:
      name: from_lat
      in: query
      description: Used only with `from=iso=...` when the ISO value has no explicit
        offset. Provide together with `from_lon` to resolve that local wall-clock time through the timezone mapped from these coordinates.
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 40.7128
    FromLon:
      name: from_lon
      in: query
      description: Used only with `from=iso=...` when the ISO value has no explicit
        offset. Provide together with `from_lat`.
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: -74.006
    FromOffset:
      name: from_offset
      in: query
      description: Used only with `from=iso=...` when the ISO value has no explicit
        offset. Interprets that local wall-clock time at this fixed UTC offset.
      required: false
      schema:
        type: string
        pattern: ^[+-](0\d|1\d|2[0-3]):[0-5]\d$
      example: -05:00
    ToTz:
      name: to_tz
      in: query
      description: Used only with `to=iso=...` when the ISO value has no explicit
        offset.
      required: false
      schema:
        type: string
    ToIp:
      name: to_ip
      in: query
      description: Used only with `to=iso=...` when the ISO value has no explicit
        offset. Resolves that local wall-clock time through the timezone mapped from this IP address.
      required: false
      schema:
        type: string
      example: 8.8.8.8
    ToLat:
      name: to_lat
      in: query
      description: Used only with `to=iso=...` when the ISO value has no explicit
        offset. Provide together with `to_lon` to resolve that local wall-clock time through the timezone mapped from these coordinates.
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 40.7128
    ToLon:
      name: to_lon
      in: query
      description: Used only with `to=iso=...` when the ISO value has no explicit
        offset. Provide together with `to_lat`.
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: -74.006
    ToOffset:
      name: to_offset
      in: query
      description: Used only with `to=iso=...` when the ISO value has no explicit
        offset. Interprets that local wall-clock time at this fixed UTC offset.
      required: false
      schema:
        type: string
        pattern: ^[+-](0\d|1\d|2[0-3]):[0-5]\d$
      example: -05:00
    BusinessDays:
      name: business_days
      in: query
      description: Set to `true` to add a `business_days` count. Days are counted by calendar
        date, start included and end excluded, unsigned; weekends follow the holiday calendar's country (Saturday/Sunday in 221 countries, Friday/Saturday in 18 such as SA, Sunday only in 8, Friday only in IR, Friday/Sunday in BN; Saturday/Sunday when no `holiday_country` is given) and holidays of the chosen calendar are skipped. Each endpoint's date is taken in its
        own zone when one is known (diff - from_*/to_* hints or a tz=/ip=/offset= specifier; elapsed -
        source_*/compare_source_*), otherwise in UTC. Enabled by `true`, `1` or `yes` (case-insensitive); any other value leaves it off without an error.
      required: false
      schema:
        type: boolean
      example: true
    HolidayCountry:
      name: holiday_country
      in: query
      description: 'Holiday calendar: one of the 249 countries with holiday calendars (862 calendars
        including subdivisions, years 1900-2100), as an ISO 3166-1 alpha-2 code in any letter case, or a
        combined ISO 3166-2 style code such as `CH-ZH`, `US-CA` or `FR-6AE`. Requires `business_days=true`.
        The full list is at https://timelogicapi.com/docs#holiday-calendars and, as JSON, at
        https://timelogicapi.com/content/holiday-calendars.json. Any other country (for example `LK`)
        returns 400 INVALID_PARAMETER "Unsupported holiday calendar."; a malformed value returns "Invalid
        holiday_country parameter."; a business-day range outside 1900-2100 returns "Holiday calendar
        coverage is only available for years 1900-2100."'
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z]{2}(-[A-Za-z0-9]+)?$
      example: US
    HolidaySubdivision:
      name: holiday_subdivision
      in: query
      description: 'Holiday calendar subdivision code for the country (the ISO 3166-2 suffix, 1-3
        letters or digits, any letter case), for example `ENG` (GB), `ZH` (CH), `MH` (IN), `01` (FI)
        or `6AE` (FR); digits and leading zeros are part of the code. Subdivisions exist for 35 countries.
        Requires `holiday_country` and `business_days=true`. An unknown code returns 400 INVALID_PARAMETER
        "Unknown holiday_subdivision ''XX'' for country DE." (also for `FI` + `1`, which must be `01`);
        a value that conflicts with a combined `holiday_country` such as `US-CA` returns 400 INVALID_PARAMETER.'
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9]+$
      example: CA
    SecondsModifier:
      name: seconds
      in: query
      required: false
      schema:
        type: integer
      example: 30
    MinutesModifier:
      name: minutes
      in: query
      required: false
      schema:
        type: integer
      example: 15
    HoursModifier:
      name: hours
      in: query
      required: false
      schema:
        type: integer
      example: 2
    DaysModifier:
      name: days
      in: query
      description: Days to add, each exactly 24 hours (86,400 seconds), so the local wall-clock
        time shifts across a DST change. There are no weeks/months/years modifiers; unknown
        parameters are ignored.
      required: false
      schema:
        type: integer
      example: 7
    WeekFlag:
      name: week
      in: query
      description: Set to `true` to add the ISO 8601 `week_number`. Enabled by `true`, `1` or `yes` (case-insensitive); any other value leaves it off without an error.
      required: false
      schema:
        type: boolean
      example: true
    NextFlag:
      name: next
      in: query
      description: Set to `true` to add `next_transition` (the next UTC offset change, or null). Enabled by `true`, `1` or `yes` (case-insensitive); any other value leaves it off without an error.
      required: false
      schema:
        type: boolean
      example: true
    Style:
      name: style
      in: query
      required: true
      description: Clock style name. Valid values are enumerated here; there is no separate style discovery endpoint.
      schema:
        type: string
        enum:
        - analog-station
        - analog-aviation
        - analog-bauhaus
        - analog-graphite
        - analog-arctic
        - analog-brass
        - analog-marine
        - analog-grid
        - analog-slate
        - analog-executive
        - digital-segment-red
        - digital-segment-amber
        - digital-segment-ice
        - digital-terminal-green
        - digital-terminal-white
        - digital-broadcast
        - digital-dashboard
        - digital-control-room
        - digital-slate
        - digital-onyx
        - digital-frost
        - digital-card
        - digital-glass
        - digital-matrix
        - digital-timetable
        - digital-split-flap
        - digital-cyan
        - digital-emerald
        - digital-monolith
        - digital-minimal
