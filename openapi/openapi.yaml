        - timezone: America/Toronto
          offset: -240
          dst: true
    InvalidParameterExample:
      summary: Generic invalid-parameter error
      value:
        error:
          code: INVALID_PARAMETER
          message: Invalid offset. Use +HH:MM or -HH:MM.
        request_id: 0f8fad5b-d9cb-469f-a165-70867728950e
    AmbiguousTargetExample:
      summary: Ambiguous target selector error
      value:
        error:
          code: AMBIGUOUS_TARGET
          message: Ambiguous target selectors. Provide only one of tz, ip, lat/lon, offset, auto_tz.
        request_id: 0f8fad5b-d9cb-469f-a165-70867728950e
    ClockInvalidStyleExample:
      summary: Invalid clock style error
      value:
        error:
          code: INVALID_PARAMETER
          message: Clock endpoint requires a valid named style.
          details:
            valid_styles:
            - analog-station
            - analog-aviation
            - digital-dashboard
        request_id: 0f8fad5b-d9cb-469f-a165-70867728950e
    UnauthorizedExample:
      summary: Unauthenticated gateway rejection
      value:
        error:
          code: UNAUTHORIZED
          message: Missing Authorization bearer token.
        request_id: 0f8fad5b-d9cb-469f-a165-70867728950e
    DependencyNotReadyExample:
      summary: Missing resolver binding
      value:
        error:
          code: DEPENDENCY_NOT_READY
          message: Timezone resolver binding is not configured.
        request_id: 0f8fad5b-d9cb-469f-a165-70867728950e
    InternalErrorExample:
      summary: Internal gateway or core failure
      value:
        error:
          code: INTERNAL_ERROR
          message: Internal server error.
        request_id: 0f8fad5b-d9cb-469f-a165-70867728950e
    UpstreamFailureExample:
      summary: Core forwarding failure
      value:
        error:
          code: INTERNAL_ERROR
          message: Failed to forward request to core worker.
          details:
            cause: upstream failure
        request_id: 0f8fad5b-d9cb-469f-a165-70867728950e
  responses:
    NotFound:
      description: 'Unknown route (including a trailing slash), or an `ip` selector with no
        timezone mapping (private, reserved and loopback addresses never resolve) - "No timezone
        mapping found for the supplied IP address."'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              $ref: '#/components/examples/UnauthorizedExample'
    AuthenticatedBadRequest:
      description: Invalid or ambiguous request parameters.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidParameter:
              $ref: '#/components/examples/InvalidParameterExample'
            ambiguousTarget:
              $ref: '#/components/examples/AmbiguousTargetExample'
    MethodNotAllowed:
      description: 'Only `GET` and `HEAD` are supported ("Only GET and HEAD are supported."), with `Allow: GET, HEAD`. `HEAD` is answered like `GET` without a body. The CORS preflight allows GET, HEAD and OPTIONS.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyNotReady:
      description: A required resolver or dependency is not configured or not ready.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            dependencyNotReady:
              $ref: '#/components/examples/DependencyNotReadyExample'
    InternalError:
      description: Internal server error, including signing failures.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              $ref: '#/components/examples/InternalErrorExample'
    UpstreamFailure:
      description: Gateway failed to forward the request to the core worker.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            upstreamFailure:
              $ref: '#/components/examples/UpstreamFailureExample'
    SubscriptionInactive:
      description: The key or customer subscription is not active.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaExceeded:
      description: The plan's monthly quota is used up (`QUOTA_EXCEEDED`, "Monthly quota
        exceeded."). The quota period is the UTC calendar month and resets at 00:00 UTC on
        the 1st; no `Retry-After` header is sent. There is no published per-second limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-TimeLogic-Quota-State:
          $ref: '#/components/headers/XTimeLogicQuotaState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - AMBIGUOUS_TARGET
          - MISSING_TARGET
          - INVALID_PARAMETER
          - INVALID_TIMESTAMP
          - DEPENDENCY_NOT_READY
          - SIGNING_NOT_READY
          - UNAUTHORIZED
          - INVALID_AUTH
          - METHOD_NOT_ALLOWED
          - NOT_FOUND
          - INTERNAL_ERROR
          - SUBSCRIPTION_INACTIVE
          - QUOTA_EXCEEDED
        message:
          type: string
        details:
          description: Optional implementation-specific detail payload.
          nullable: true
    ErrorResponse:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
          description: Intentionally omitted from public API error responses, including
            per-item errors inside bulk arrays, to avoid exposing request timing; use request_id
            for support correlation.
    BulkError:
      description: Per-item error wrapper used inside bulk arrays returned by bulk-capable
        routes.
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        required:
        - item
        properties:
          item:
            type: string
    TimePayload:
      title: Single time payload
      description: Canonical single-target time payload.
      type: object
      required:
      - unix
      - unix_ms
      - utc
      - iso_local
      - rfc2822
      - human
      - day_number
      - day_short
      - day_full
      - timezone
      properties:
        unix:
          type: integer
          format: int64
        unix_ms:
          type: integer
          format: int64
        utc:
          type: string
          format: date-time
        iso_local:
          type: string
          nullable: true
        rfc2822:
          type: string
        human:
          type: string
        day_number:
          type: integer
          minimum: 1
          maximum: 7
          description: Day of the week counted from Sunday (1 = Sunday, 2 = Monday ... 7 = Saturday).
        day_short:
          type: string
        day_full:
          type: string
        timezone:
          type: string
          nullable: true
        formatted:
          type: string
    TimePayloadBulkItem:
      title: Bulk time payload item
      description: One bulk array item, either a successful time payload or a per-item
        bulk error.
      oneOf:
      - $ref: '#/components/schemas/TimePayload'
      - $ref: '#/components/schemas/BulkError'
    TimePayloadBulkResponse:
      title: Bulk time payload array
      description: Bulk response array returned when `/v1/time/current` or `/v1/time/convert`
        receives one comma-separated `tz`, `ip`, or `offset` selector.
      type: array
      items:
        $ref: '#/components/schemas/TimePayloadBulkItem'
    DiffEndpointRef:
      description: Resolved endpoint reference for diff calculations. This object intentionally
        includes only the resolved epoch-millisecond instant.
      type: object
      required:
      - unix_ms
      properties:
        unix_ms:
          type: integer
          format: int64
    DiffResponse:
      type: object
      required:
      - seconds
      - minutes
      - hours
      - days
      - direction
      - human
      - from
      - to
      properties:
        seconds:
          type: integer
        minutes:
          type: integer
        hours:
          type: integer
        days:
          type: integer
        direction:
          description: '`forward` means `to` is after `from`. `backward` means `to` is before `from`. `same` means both sides resolve to the same instant.'
          type: string
          enum:
          - forward
          - backward
          - same
        human:
          type: string
        formatted:
          type: string
        business_days:
          type: integer
        from:
          $ref: '#/components/schemas/DiffEndpointRef'
        to:
          $ref: '#/components/schemas/DiffEndpointRef'
    CalendarResponse:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - type: object
        required:
        - year
        - month
        - month_name
        - day
        properties:
          year:
            type: integer
          month:
            type: integer
          month_name:
            type: string
          day:
            type: integer
          week_number:
            type: integer
            description: ISO 8601 week number (present with `week=true`). It belongs to the
              ISO week-year, which is not returned and can differ from `year` near January 1
              (2027-01-01 is week 53 of 2026).
    DstResponse:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - type: object
        required:
        - dst_active
        properties:
          dst_active:
            type: boolean
          next_transition:
            type: string
            format: date-time
            nullable: true
            description: Present only with `next=true`. The instant of the next UTC offset change,
              written in the offset in force before it (e.g. `2026-11-01T02:00:00-04:00`); the new
              offset is not returned. `null` when no change is scheduled, for offset targets and
              with no selector. Tracks offset changes only, so `dst_active` can change without one.
    ElapsedResponse:
      type: object
      required:
      - seconds
      - minutes
      - hours
      - days
      - human
      - direction
      properties:
        seconds:
          type: integer
        minutes:
          type: integer
        hours:
          type: integer
        days:
          type: integer
        human:
          type: string
        direction:
          description: '`left` means the reference instant is after the compared instant (now,
            or `compare_*`). `passed` means it is before it, or equal to it.'
          type: string
          enum:
          - left
          - passed
        formatted:
          type: string
        business_days:
          type: integer
    TimezoneResponse:
      title: Timezone lookup response
      description: 'Timezone lookup result. It is the time payload for the resolved target
        plus `offset` (minutes east of UTC) and `dst`.


        Every selector returns this one shape. `tz`, `ip`, `lat` + `lon` and `auto_tz`
        lookups resolve a named zone, so `timezone` is set and `matching_zones` is absent.
        `offset` lookups return `timezone=null` and add `matching_zones`, the geographic
        zones whose current offset equals the requested one.'
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - type: object
        required:
        - offset
        - dst
        properties:
          offset:
            type: integer
            description: UTC offset of the resolved target in minutes, for example `-240`
              for UTC-04:00.
          dst:
            type: boolean
            description: Whether daylight saving time is in effect for the resolved target.
              Always `false` for `offset` lookups.
          offset_seconds:
            type: integer
            description: Exact UTC offset in seconds. Present only when the resolved offset
              has a seconds part (historical local mean time); no zone has one at the current
              instant, so lookups today do not include it.
          matching_zones:
            type: array
            description: Present only for `offset=` lookups. The geographic zones whose
              current offset equals the requested one. `UTC` and `Etc/*` zones are intentionally
              excluded; use `tz=UTC` for UTC.
            items:
              $ref: '#/components/schemas/TimezoneMatch'
    TimezoneMatch:
      description: One geographic zone whose current offset equals the requested offset.
      type: object
      required:
      - timezone
      - offset
      - dst
      properties:
        timezone:
          type: string
          description: IANA timezone name.
        offset:
          type: integer
          description: Current UTC offset of the zone in minutes.
        dst:
          type: boolean
          description: Whether daylight saving time is currently in effect in the zone.
    JwkKey:
      type: object
      required:
      - kty
      - crv
      - alg
      - use
      - kid
      - x
      properties:
        kty:
          type: string
          enum:
          - OKP
        crv:
          type: string
          enum:
          - Ed25519
        alg:
          type: string
          enum:
          - EdDSA
        use:
          type: string
          enum:
          - sig
        kid:
          type: string
          example: ed25519-2026-07-19
        x:
          type: string
        key_ops:
          type: array
          description: Permitted key operations; published keys allow only `verify`.
          items:
            type: string
            enum:
            - verify
        ext:
          type: boolean
          description: JWK extractable flag as exported by the signing worker; always `true`.
    JwksResponse:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'
