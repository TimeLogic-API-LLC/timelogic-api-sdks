      - kid
      - x
      properties:
        kty:
          type: string
          enum:
          - OKP
        crv:
          type: string
          enum:
          - Ed25519
        alg:
          type: string
          enum:
          - EdDSA
        use:
          type: string
          enum:
          - sig
