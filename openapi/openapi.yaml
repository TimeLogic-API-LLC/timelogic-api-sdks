  /v1/timezone:
    get:
      tags:
      - Time
      summary: Resolve timezone information for a target
      description: 'Resolves timezone metadata for a single target.


        Target selector rules:

        - Use exactly one selector family: `tz`, `ip`, `lat` + `lon`, `offset`, or
        `auto_tz=true`.

        - Bulk is not supported on this route.

        - With no selector the route returns 400 MISSING_TARGET.

        - `offset` queries return a specialized payload with `timezone=null` and `matching_zones`
        for the request-time offset match. Only geographic zones are listed; `UTC` and `Etc/*`
        are intentionally excluded (use `tz=UTC` for UTC).

        - `tz` names resolve to their canonical zone (`Europe/Stockholm` returns `Europe/Berlin`).

        - An `ip` with no timezone mapping returns 404 NOT_FOUND.


        Examples:

        - Single target: `/v1/timezone?tz=America/New_York`

        - Offset match: `/v1/timezone?offset=-04:00`'
