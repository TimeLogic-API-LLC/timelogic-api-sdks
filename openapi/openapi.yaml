          $ref: '#/components/headers/XTimeLogicQuotaState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - AMBIGUOUS_TARGET
          - MISSING_TARGET
          - INVALID_PARAMETER
          - INVALID_TIMESTAMP
          - DEPENDENCY_NOT_READY
          - SIGNING_NOT_READY
          - UNAUTHORIZED
          - INVALID_AUTH
          - METHOD_NOT_ALLOWED
          - NOT_FOUND
          - INTERNAL_ERROR
          - SUBSCRIPTION_INACTIVE
          - QUOTA_EXCEEDED
        message:
          type: string
        details:
          description: Optional implementation-specific detail payload.
          nullable: true
    ErrorResponse:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
          description: Intentionally omitted from public API error responses to avoid
            exposing request timing; use request_id for support correlation.
    BulkError:
      description: Per-item error wrapper used inside bulk arrays returned by bulk-capable
        routes.
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        required:
        - item
        properties:
          item:
            type: string
    TimePayload:
      title: Single time payload
      description: Canonical single-target time payload.
      type: object
      required:
      - unix
      - unix_ms
      - utc
      - iso_local
      - rfc2822
      - human
      - day_number
      - day_short
      - day_full
      - timezone
      properties:
        unix:
          type: integer
          format: int64
        unix_ms:
          type: integer
          format: int64
        utc:
          type: string
          format: date-time
        iso_local:
          type: string
          nullable: true
        rfc2822:
          type: string
        human:
          type: string
        day_number:
          type: integer
          minimum: 1
          maximum: 7
        day_short:
          type: string
        day_full:
          type: string
        timezone:
          type: string
          nullable: true
        formatted:
          type: string
    TimePayloadBulkItem:
      title: Bulk time payload item
      description: One bulk array item, either a successful time payload or a per-item
        bulk error.
      oneOf:
      - $ref: '#/components/schemas/TimePayload'
      - $ref: '#/components/schemas/BulkError'
    TimePayloadBulkResponse:
      title: Bulk time payload array
      description: Bulk response array returned when `/v1/time/current` or `/v1/time/convert`
        receives one comma-separated `tz`, `ip`, or `offset` selector.
      type: array
      items:
        $ref: '#/components/schemas/TimePayloadBulkItem'
    DiffEndpointRef:
      description: Resolved endpoint reference for diff calculations. This object intentionally
        includes only the resolved epoch-millisecond instant.
      type: object
      required:
      - unix_ms
      properties:
        unix_ms:
          type: integer
          format: int64
    DiffResponse:
      type: object
      required:
      - seconds
      - minutes
      - hours
      - days
      - direction
      - human
      - from
      - to
      properties:
        seconds:
          type: integer
        minutes:
          type: integer
        hours:
          type: integer
        days:
          type: integer
        direction:
          description: '`forward` means `to` is after `from`. `backward` means `to` is before `from`. `same` means both sides resolve to the same instant.'
          type: string
          enum:
          - forward
          - backward
          - same
        human:
          type: string
        formatted:
          type: string
        business_days:
          type: integer
        from:
          $ref: '#/components/schemas/DiffEndpointRef'
        to:
          $ref: '#/components/schemas/DiffEndpointRef'
    CalendarResponse:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - type: object
        required:
        - year
        - month
        - month_name
        - day
        properties:
          year:
            type: integer
          month:
            type: integer
          month_name:
            type: string
          day:
            type: integer
          week_number:
            type: integer
    DstResponse:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - type: object
        required:
        - dst_active
        properties:
          dst_active:
            type: boolean
          next_transition:
            type: string
            format: date-time
            nullable: true
    ElapsedResponse:
      type: object
      required:
      - seconds
      - minutes
      - hours
      - days
      - human
      - direction
      properties:
        seconds:
          type: integer
        minutes:
          type: integer
        hours:
          type: integer
        days:
          type: integer
        human:
          type: string
        direction:
          description: '`left` means the target instant is still in the future. `passed`
            means the target instant is already in the past.'
          type: string
          enum:
          - left
          - passed
        formatted:
          type: string
        business_days:
          type: integer
    TimezoneResolvedResponse:
      title: Resolved timezone response
      description: Standard single-target timezone resolution payload.
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - type: object
        required:
        - offset
        - dst
        properties:
          offset:
            type: integer
          dst:
            type: boolean
    TimezoneMatch:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - type: object
        required:
