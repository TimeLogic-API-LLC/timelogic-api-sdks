name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-generate-test:
    name: Validate, generate, and test
    runs-on: ubuntu-latest
    env:
      TIMELOGIC_SDK_TEST_BASE_URL: ${{ vars.TIMELOGIC_SDK_TEST_BASE_URL || 'https://api.timelogicapi.com' }}
      TIMELOGIC_SDK_TEST_API_KEY: ${{ secrets.TIMELOGIC_SDK_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Report whether openapi.yaml is behind openapi-direct.yaml
        run: npm run build-spec -- --check
      - run: npm run generate
      - run: npm run verify-generated
      - run: npm run test:contract
      - run: npm run verify-worldtimeapi
      - name: Ensure generated output is committed
        run: git diff --exit-code -- openapi packages config Package.swift Package.resolved composer.json phpunit.xml.dist

  package-smoke:
    name: Package smoke tests (${{ matrix.language }})
    needs: validate-generate-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, rust, go, java, csharp, php, ruby, kotlin, swift]
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated package directory
        shell: bash
        run: test -d "packages/${{ matrix.language }}"
      - name: Show package contents
        run: find "packages/${{ matrix.language }}" -maxdepth 2 -type f | sort | head -80

  php-build-test:
    name: Validate and test PHP SDK (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    needs: validate-generate-test
    runs-on: ubuntu-latest
    env:
      TIMELOGIC_SDK_TEST_BASE_URL: ${{ vars.TIMELOGIC_SDK_TEST_BASE_URL || 'https://api.timelogicapi.com' }}
      TIMELOGIC_SDK_TEST_API_KEY: ${{ secrets.TIMELOGIC_SDK_TEST_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        # 8.5 is the latest PHP release; 8.2-8.4 are the other branches that
        # still receive security fixes. 7.4 with the lowest allowed
        # dependencies proves the oldest versions composer.json accepts.
        php: ['8.5', '8.4', '8.3', '8.2']
        dependencies: [highest]
        include:
          - php: '7.4'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          tools: composer:v2
      - run: composer validate --strict
      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --prefer-dist
          fi
      - name: Check dependencies for security advisories
        run: composer audit --abandoned=report
      - run: vendor/bin/phpunit -c phpunit.xml.dist

  java-build-test:
    name: Build and test Java SDK
    needs: validate-generate-test
    runs-on: ubuntu-latest
    env:
      TIMELOGIC_SDK_TEST_BASE_URL: ${{ vars.TIMELOGIC_SDK_TEST_BASE_URL || 'https://api.timelogicapi.com' }}
      TIMELOGIC_SDK_TEST_API_KEY: ${{ secrets.TIMELOGIC_SDK_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Test Java SDK
        run: mvn -B --no-transfer-progress test
        working-directory: packages/java

  kotlin-build-test:
    name: Build and test Kotlin SDK
    needs: validate-generate-test
    runs-on: ubuntu-latest
    env:
      TIMELOGIC_SDK_TEST_BASE_URL: ${{ vars.TIMELOGIC_SDK_TEST_BASE_URL || 'https://api.timelogicapi.com' }}
      TIMELOGIC_SDK_TEST_API_KEY: ${{ secrets.TIMELOGIC_SDK_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Kotlin SDK
        run: bash ./gradlew --no-daemon test
        working-directory: packages/kotlin

  swift-build-test:
    name: Build and test Swift SDK
    needs: validate-generate-test
    runs-on: macos-15
    env:
      TIMELOGIC_SDK_TEST_BASE_URL: ${{ vars.TIMELOGIC_SDK_TEST_BASE_URL || 'https://api.timelogicapi.com' }}
      TIMELOGIC_SDK_TEST_API_KEY: ${{ secrets.TIMELOGIC_SDK_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Swift dependencies
        run: swift package resolve
      - name: Build Swift SDK
        run: swift build
      - name: Test Swift SDK
        run: swift test

  worldtimeapi-clients:
    name: WorldTimeAPI-compatible clients (TypeScript, Python, Go, Rust, .NET, Ruby)
    needs: validate-generate-test
    runs-on: ubuntu-latest
    env:
      TIMELOGIC_API_KEY: ${{ secrets.TIMELOGIC_SDK_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the contract against every SDK client
        run: npm run verify-worldtimeapi
      - name: TypeScript
        working-directory: packages/typescript
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          node --test test/worldtimeapi.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python
        working-directory: packages/python
        run: |
          python -m pip install -e . pytest
          python -m pytest -q test/test_worldtimeapi.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go
        working-directory: packages/go
        run: |
          go vet ./worldtimeapi/
          go test ./worldtimeapi/
      - name: Rust
        working-directory: packages/rust
        run: cargo test worldtimeapi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: .NET
        working-directory: packages/csharp
        run: dotnet test src/TimeLogic.Api.Test/TimeLogic.Api.Test.csproj --filter "FullyQualifiedName~WorldTimeApi"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: packages/ruby
          bundler-cache: true
      - name: Ruby
        working-directory: packages/ruby
        run: bundle exec rspec spec/world_time_api_spec.rb

  v1-typed-responses:
    name: Typed /v1 responses (TypeScript, Python, Go, Rust, .NET, Ruby)
    needs: validate-generate-test
    runs-on: ubuntu-latest
    env:
      TIMELOGIC_SDK_TEST_BASE_URL: ${{ vars.TIMELOGIC_SDK_TEST_BASE_URL || 'https://api.timelogicapi.com' }}
      TIMELOGIC_SDK_TEST_API_KEY: ${{ secrets.TIMELOGIC_SDK_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: TypeScript
        working-directory: packages/typescript
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          node --test test/v1-responses.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python
        working-directory: packages/python
        run: |
          python -m pip install -e . pytest
          python -m pytest -q test/test_v1_responses.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go
        working-directory: packages/go
        run: go test -run TestV1 .
      - name: Rust
        working-directory: packages/rust
        run: cargo test --test v1_responses
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: .NET
        working-directory: packages/csharp
        run: dotnet test src/TimeLogic.Api.Test/TimeLogic.Api.Test.csproj --filter "FullyQualifiedName~V1Responses"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: packages/ruby
          bundler-cache: true
      - name: Ruby
        working-directory: packages/ruby
        run: bundle exec rspec spec/v1_responses_spec.rb
