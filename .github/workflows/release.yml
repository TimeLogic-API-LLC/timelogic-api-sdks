name: Release SDKs

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Registry target to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - npm
          - crates
          - go
          - nuget
          - maven
          - kotlin
          - ruby
          - php
      version:
        description: Package version to publish (required for manual runs from a branch)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.value }}
    steps:
      - id: release-version
        name: Resolve package version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${TARGET_INPUT}" == "all" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "The all target must be dispatched from its vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          version="${VERSION_INPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Set a semantic version input or run this workflow from a vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run generate
        env:
          SDK_VERSION: ${{ steps.release-version.outputs.value }}
      - run: npm run verify-generated
      - run: npm run test:contract
      - run: git diff --exit-code -- openapi config Package.swift Package.resolved composer.json phpunit.xml.dist
      - uses: actions/upload-artifact@v4
        with:
          name: generated-sdks
          path: packages/
          if-no-files-found: error

  update-release-docs:
    needs: [verify, github-release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'all')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace tracked SDKs with verified release output
        run: git rm -r --quiet packages
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - name: Update documentation versions
        run: node scripts/update-release-docs.mjs
        env:
          SDK_VERSION: ${{ needs.verify.outputs.version }}
      - name: Commit updated release documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .sdk-version ':(glob)**/*.md' packages/
          if git diff --cached --quiet; then
            echo 'Release documentation and generated SDKs already use this version.'
            exit 0
          fi
          git commit -m "chore: update SDK files for v${SDK_VERSION}"
          git push origin HEAD:main
        env:
          SDK_VERSION: ${{ needs.verify.outputs.version }}

  npm:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'npm' }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.5.1
      - run: npm --version
      - run: npm install --no-package-lock --ignore-scripts
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript
      - run: npm pack --dry-run
        working-directory: packages/typescript
      - id: npm-version
        name: Check whether the npm version already exists
        working-directory: packages/typescript
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public
        if: steps.npm-version.outputs.published != 'true'
        working-directory: packages/typescript

  pypi:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install build
      - run: python -m build
        working-directory: packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/

  crates:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    if: ${{ vars.PUBLISH_CRATES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'crates') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --allow-dirty
        working-directory: packages/rust
      - run: cargo publish --allow-dirty
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  go:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'go' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test Go SDK
        run: go test ./...
        working-directory: packages/go
      - name: Vet Go SDK
        run: go vet ./...
        working-directory: packages/go
      - name: Publish Go module tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Go module publication requires a semver release tag (for example v1.0.1)."
            exit 1
          fi
          version_tag="${GITHUB_REF_NAME#v}"
          tag="packages/go/v${version_tag}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; Go proxy publication is already complete."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/go
          tree=$(git write-tree)
          release_commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "${tree}" -p "${GITHUB_SHA}" -m "Prepare Go SDK v${version_tag}")
          git tag -a "${tag}" "${release_commit}" -m "Release Go SDK v${version_tag}"
          git push origin "${tag}"

  nuget:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'nuget' }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test TimeLogic.Api.sln -c Release
        working-directory: packages/csharp
      - run: dotnet pack src/TimeLogic.Api/TimeLogic.Api.csproj -c Release -o artifacts
        working-directory: packages/csharp
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: packages/csharp
      - name: Wait for public NuGet indexing
        shell: bash
        working-directory: packages/csharp
        run: |
          package_id=$(sed -n 's:.*<PackageId>\([^<]*\)</PackageId>.*:\1:p' src/TimeLogic.Api/TimeLogic.Api.csproj)
          package_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/TimeLogic.Api/TimeLogic.Api.csproj)
          package_id_lower=$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')
          index_url="https://api.nuget.org/v3-flatcontainer/${package_id_lower}/index.json"
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$index_url" | grep -Fq "\"$package_version\""; then
              echo "NuGet catalog contains ${package_id} ${package_version}."
              exit 0
            fi
            echo "NuGet catalog is still indexing ${package_id} ${package_version} (attempt ${attempt}/20)."
            sleep 15
          done
          echo "::warning::NuGet accepted the upload but did not expose ${package_id} ${package_version} in the public catalog within five minutes. Check the package index again later."
          exit 0

  php:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'php' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml.dist
      - name: Report Packagist release behavior
        run: echo "Packagist indexes the committed Git tag through its repository webhook; no archive upload is required."

  swift:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'all')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - name: Publish Swift source tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Swift source-tag publication requires a semver release tag (for example v1.0.1)."
            exit 1
          fi
          version_tag="${GITHUB_REF_NAME#v}"
          tag="packages/swift/v${version_tag}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; Swift source publication is already complete."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/swift
          tree=$(git write-tree)
          release_commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "${tree}" -p "${GITHUB_SHA}" -m "Prepare Swift SDK v${version_tag}")
          git tag -a "${tag}" "${release_commit}" -m "Release Swift SDK v${version_tag}"
          git push origin "${tag}"

  ruby:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ruby' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec rspec
        working-directory: packages/ruby
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Build generated gem
        working-directory: packages/ruby
        env:
          SDK_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p pkg
          gem build timelogic-api.gemspec --output "pkg/timelogic-api-${SDK_VERSION}.gem"
          ruby -e 'require "rubygems/package"; abort "gem version mismatch" unless Gem::Package.new(ARGV.fetch(0)).spec.version.to_s == ENV.fetch("SDK_VERSION")' "pkg/timelogic-api-${SDK_VERSION}.gem"
      - name: Publish generated gem
        working-directory: packages/ruby
        env:
          SDK_VERSION: ${{ needs.verify.outputs.version }}
        run: gem push "pkg/timelogic-api-${SDK_VERSION}.gem"

  maven:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'maven' }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - uses: crazy-max/ghaction-import-gpg@v6
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Run Java tests
        run: mvn -B --no-transfer-progress test
        working-directory: packages/java
      - name: Publish signed Java SDK to Maven Central
        run: mvn -B --no-transfer-progress -Psign-artifacts deploy -DskipTests
        working-directory: packages/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  kotlin:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'kotlin' }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages/
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin tests
        run: bash ./gradlew --no-daemon test
        working-directory: packages/kotlin
      - name: Publish signed Kotlin SDK to Maven Central
        run: bash ./gradlew --no-daemon publishToMavenCentral
        working-directory: packages/kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  github-release:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
