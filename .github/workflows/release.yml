name: Release SDKs

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Registry target to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - crates
          - nuget

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run generate
      - run: npm run verify-generated
      - run: npm run test:contract
      - run: git diff --exit-code -- openapi packages config

  npm:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript
      - run: npm pack --dry-run
        working-directory: packages/typescript
      - id: npm-version
        name: Check whether the npm version already exists
        working-directory: packages/typescript
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public
        if: steps.npm-version.outputs.published != 'true'
        working-directory: packages/typescript

  pypi:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install build
      - run: python -m build
        working-directory: packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/

  crates:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    if: ${{ vars.PUBLISH_CRATES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'crates') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run
        working-directory: packages/rust
      - run: cargo publish
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  nuget:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'nuget' }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test TimeLogic.Api.sln -c Release
        working-directory: packages/csharp
      - run: dotnet pack src/TimeLogic.Api/TimeLogic.Api.csproj -c Release -o artifacts
        working-directory: packages/csharp
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: packages/csharp
      - name: Wait for public NuGet indexing
        shell: bash
        working-directory: packages/csharp
        run: |
          package_id=$(sed -n 's:.*<PackageId>\([^<]*\)</PackageId>.*:\1:p' src/TimeLogic.Api/TimeLogic.Api.csproj)
          package_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/TimeLogic.Api/TimeLogic.Api.csproj)
          package_id_lower=$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')
          index_url="https://api.nuget.org/v3-flatcontainer/${package_id_lower}/index.json"
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$index_url" | grep -Fq "\"$package_version\""; then
              echo "NuGet catalog contains ${package_id} ${package_version}."
              exit 0
            fi
            echo "NuGet catalog is still indexing ${package_id} ${package_version} (attempt ${attempt}/20)."
            sleep 15
          done
          echo "NuGet accepted the upload but did not expose ${package_id} ${package_version} in the public catalog within five minutes."
          exit 1

  github-release:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
