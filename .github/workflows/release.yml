name: Release SDKs

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Registry target to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - npm
          - crates
          - go
          - nuget
          - maven
          - kotlin
          - ruby
          - php

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run generate
      - run: npm run verify-generated
      - run: npm run test:contract
      - run: git diff --exit-code -- openapi packages config Package.swift Package.resolved composer.json phpunit.xml.dist

  npm:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'npm' }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript
      - run: npm pack --dry-run
        working-directory: packages/typescript
      - id: npm-version
        name: Check whether the npm version already exists
        working-directory: packages/typescript
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public
        if: steps.npm-version.outputs.published != 'true'
        working-directory: packages/typescript

  pypi:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install build
      - run: python -m build
        working-directory: packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/

  crates:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    if: ${{ vars.PUBLISH_CRATES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'crates') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run
        working-directory: packages/rust
      - run: cargo publish
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  go:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'go' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test Go SDK
        run: go test ./...
        working-directory: packages/go
      - name: Vet Go SDK
        run: go vet ./...
        working-directory: packages/go
      - name: Publish Go module tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Go module publication requires a semver release tag (for example v1.0.1)."
            exit 1
          fi
          version_tag="${GITHUB_REF_NAME#v}"
          tag="packages/go/v${version_tag}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; Go proxy publication is already complete."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "Release Go SDK v${version_tag}"
          git push origin "${tag}"

  nuget:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'nuget' }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test TimeLogic.Api.sln -c Release
        working-directory: packages/csharp
      - run: dotnet pack src/TimeLogic.Api/TimeLogic.Api.csproj -c Release -o artifacts
        working-directory: packages/csharp
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: packages/csharp
      - name: Wait for public NuGet indexing
        shell: bash
        working-directory: packages/csharp
        run: |
          package_id=$(sed -n 's:.*<PackageId>\([^<]*\)</PackageId>.*:\1:p' src/TimeLogic.Api/TimeLogic.Api.csproj)
          package_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/TimeLogic.Api/TimeLogic.Api.csproj)
          package_id_lower=$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')
          index_url="https://api.nuget.org/v3-flatcontainer/${package_id_lower}/index.json"
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$index_url" | grep -Fq "\"$package_version\""; then
              echo "NuGet catalog contains ${package_id} ${package_version}."
              exit 0
            fi
            echo "NuGet catalog is still indexing ${package_id} ${package_version} (attempt ${attempt}/20)."
            sleep 15
          done
          echo "NuGet accepted the upload but did not expose ${package_id} ${package_version} in the public catalog within five minutes."
          exit 1

  php:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'php' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml.dist
      - name: Report Packagist release behavior
        run: echo "Packagist indexes the committed Git tag through its repository webhook; no archive upload is required."

  swift:
    needs: verify
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Swift source tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Swift source-tag publication requires a semver release tag (for example v1.0.1)."
            exit 1
          fi
          version_tag="${GITHUB_REF_NAME#v}"
          tag="packages/swift/v${version_tag}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; Swift source publication is already complete."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "Release Swift SDK v${version_tag}"
          git push origin "${tag}"

  ruby:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ruby' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec rspec
        working-directory: packages/ruby
      - uses: rubygems/release-gem@v1
        with:
          working-directory: packages/ruby

  maven:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'maven' }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - uses: crazy-max/ghaction-import-gpg@v6
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Run Java tests
        run: mvn -B --no-transfer-progress test
        working-directory: packages/java
      - name: Publish signed Java SDK to Maven Central
        run: mvn -B --no-transfer-progress -Psign-artifacts deploy -DskipTests
        working-directory: packages/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  kotlin:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'kotlin' }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin tests
        run: bash ./gradlew --no-daemon test
        working-directory: packages/kotlin
      - name: Publish signed Kotlin SDK to Maven Central
        run: bash ./gradlew --no-daemon publishToMavenCentral
        working-directory: packages/kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  github-release:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
