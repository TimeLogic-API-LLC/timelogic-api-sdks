[package]
name = "timelogic-api"
version = "1.0.0"
authors = ["TimeLogic API LLC"]
description = "Official Rust SDK for TimeLogic API, a world time API."
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"
repository = "https://github.com/TimeLogic-API-LLC/timelogic-api-sdks"
homepage = "https://github.com/TimeLogic-API-LLC/timelogic-api-sdks"
readme = "README.md"
keywords = ["time", "timezone", "world-time", "api"]
categories = ["api-bindings", "date-and-time"]

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
reqwest = { version = "^0.12", features = ["json", "multipart"] }
