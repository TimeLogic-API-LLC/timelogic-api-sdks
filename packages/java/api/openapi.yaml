openapi: 3.0.3
info:
  description: |-
    Official public API contract for TimeLogic API.

    This public spec excludes `/healthz` and the shared clock asset routes. It keeps `/.well-known/time-api-public-key`, `/v1/time/clock`, and signed JSON response controls because public consumers may need them.

    Authentication:
    - the API supports `Authorization: Bearer <token>`, `X-API-Key`, and `api_key` query credentials
    - RapidAPI access uses `X-RapidAPI-Key` and `X-RapidAPI-Host`; the SDKs expose this as a `rapidApi` transport option that accepts only the RapidAPI key

    Behavioral notes:
    - all documented operations are `GET`
    - only one selector family may be used at a time
    - current and convert support bulk only through one comma-separated `tz`, `ip`, or `offset` selector
    - add, diff, calendar, dst, elapsed, timezone, and clock are single-target routes
    - credentials are extracted in Authorization, X-API-Key, then api_key query order; conflicting values are rejected
    - the first server is the default API host. The second server is the RapidAPI gateway and can be selected or overridden by SDK configuration
    - `sign` is available on supported JSON routes and is not supported on `/v1/time/clock`
  title: TimeLogic API | A World Time API
  version: 1.0.0
servers:
- description: Default TimeLogic API host; override `host` for a customer-specific
    domain or subdomain.
  url: "https://{host}"
  variables:
    host:
      default: api.timelogicapi.com
      description: HTTPS hostname serving this API.
- description: RapidAPI gateway; SDKs select this when rapidApi is enabled.
  url: "https://{rapidapiHost}"
  variables:
    rapidapiHost:
      default: timelogic-api-world-time-timezones-time-calculations.p.rapidapi.com
      description: RapidAPI gateway hostname. Override for a compatible proxy or test
        gateway.
security:
- bearerAuth: []
- apiKeyHeader: []
- apiKeyQuery: []
- rapidApiKey: []
  rapidApiHost: []
tags:
- description: Public verification and support routes.
  name: Utility
- description: "Time, timezone, calendar, and duration operations."
  name: Time
paths:
  /.well-known/time-api-public-key:
    get:
      description: |-
        Unauthenticated JWKS endpoint for verifying signed JSON responses.

        The public gateway proxies this route to the dedicated `time-signing` worker. For compatibility with client tooling, the gateway serves the JWKS body as standard `application/json`.

        Use this endpoint together with the detached signature headers returned on supported `sign=true` JSON responses:
        - `X-TimeLogic-Key-Id`
        - `X-TimeLogic-Signature`
        - `X-TimeLogic-Signature-Alg`
        - `X-TimeLogic-Signature-Timestamp`
        - `X-TimeLogic-Content-SHA256` - `X-TimeLogic-Signature-Input`
        `X-TimeLogic-Signature-Input` is the exact Base64URL-encoded UTF-8 `v1` envelope. It signs the path and query (including `sign=true`), but deliberately excludes the scheme, host, and `Content-Type` so proxy normalization cannot change the signed bytes.

        Behavior:
        - without a query string, the response returns the full retained JWKS set
        - the active Ed25519 key is listed first
        - `kid=<key-id>` returns only the matching retained public key
        - historical public keys may remain published after rotation so older signed responses can still be verified
      operationId: getPublicSigningKey
      parameters:
      - description: "Optional signing key identifier filter, for example `ed25519-2026-07-19`.\
          \ When present, the response returns only the matching retained public key."
        explode: true
        in: query
        name: kid
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                currentKeySet:
                  $ref: '#/components/examples/JwksExample'
                currentKeyByKid:
                  $ref: '#/components/examples/JwksSingleKeyExample'
              schema:
                $ref: '#/components/schemas/JwksResponse'
          description: Ed25519 signing key set. The active key is listed first.
        "404":
          content:
            application/json:
              examples:
                missingKid:
                  $ref: '#/components/examples/SigningKeyNotFoundExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No retained signing key exists for the requested `kid`.
        "500":
          content:
            application/json:
              examples:
                internalError:
                  $ref: '#/components/examples/InternalErrorExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Signing public keys are not configured or could not be loaded.
      security: []
      summary: Public signing key set
      tags:
      - Utility
      x-accepts:
      - application/json
  /v1/time/current:
    get:
      description: |-
        Returns current time data for a single target, or a bulk array when exactly one of `tz`, `ip`, or `offset` is supplied as a comma-separated list.

        Target selector rules:
        - Use at most one selector family per request: `tz`, `ip`, `lat` + `lon`, `offset`, or `auto_tz=true`.
        - If no selector is provided, the response defaults to UTC with `timezone=null` and `iso_local=null`.
        - Bulk mode is available only through one comma-separated `tz`, `ip`, or `offset` selector and cannot be combined with any other selector.

        Example:
        - Single target: `/v1/time/current?tz=America/New_York`
        - For bulk, provide one comma-separated `tz`, `ip`, or `offset` value, for example `/v1/time/current?tz=America/New_York,Europe/London,Asia/Tokyo`.
      operationId: getCurrentTime
      parameters:
      - description: "IANA timezone name. On bulk-capable routes, a comma-separated\
          \ list enables bulk mode."
        example: America/New_York
        explode: true
        in: query
        name: tz
        required: false
        schema:
          maxLength: 64
          type: string
        style: form
      - description: "IP address. On bulk-capable routes, a comma-separated list enables\
          \ bulk mode."
        example: 8.8.8.8
        explode: true
        in: query
        name: ip
        required: false
        schema:
          type: string
        style: form
      - description: Latitude. Must be provided together with `lon`.
        example: 40.7128
        explode: true
        in: query
        name: lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
        style: form
      - description: Longitude. Must be provided together with `lat`.
        example: -74.006
        explode: true
        in: query
        name: lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
        style: form
      - description: "Fixed UTC offset in `+HH:MM` or `-HH:MM` format. On bulk-capable\
          \ routes, a comma-separated list enables bulk mode."
        example: -04:00
        explode: true
        in: query
        name: offset
        required: false
        schema:
          pattern: "^[+-](0\\d|1\\d|2[0-3]):[0-5]\\d$"
          type: string
        style: form
      - description: Set to `true` to resolve using the caller IP from Cloudflare
          headers.
        example: true
        explode: true
        in: query
        name: auto_tz
        required: false
        schema:
          type: boolean
        style: form
      - description: "Custom date/time format template using supported `strftime`-style\
          \ directives such as `%Y-%m-%d %H:%M:%S`. Reference: [strftime](https://strftime.net/)."
        example: '%Y-%m-%d %H:%M:%S'
        explode: true
        in: query
        name: format
        required: false
        schema:
          type: string
        style: form
      - description: "Set to exactly `true` to ask the gateway to sign the final JSON\
          \ response. Every authenticated JSON response, including errors, then includes\
          \ signing headers. Not supported on `/v1/time/clock`."
        example: true
        explode: true
        in: query
        name: sign
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                singleTarget:
                  $ref: '#/components/examples/CurrentSingleExample'
                bulkByTimezone:
                  $ref: '#/components/examples/CurrentBulkExample'
                bulkPartialFailure:
                  $ref: '#/components/examples/CurrentBulkPartialFailureExample'
              schema:
                $ref: '#/components/schemas/getCurrentTime_200_response'
          description: Current time payload or bulk array.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-TimeLogic-Signature:
              $ref: '#/components/headers/XTimeLogicSignature'
            X-TimeLogic-Key-Id:
              $ref: '#/components/headers/XTimeLogicKeyId'
            X-TimeLogic-Signature-Alg:
              $ref: '#/components/headers/XTimeLogicSignatureAlg'
            X-TimeLogic-Signature-Timestamp:
              $ref: '#/components/headers/XTimeLogicSignatureTimestamp'
            X-TimeLogic-Content-SHA256:
              $ref: '#/components/headers/XTimeLogicContentSha256'
            X-TimeLogic-Signature-Input:
              $ref: '#/components/headers/XTimeLogicSignatureInput'
        "400":
          content:
            application/json:
              examples:
                invalidParameter:
                  $ref: '#/components/examples/InvalidParameterExample'
                ambiguousTarget:
                  $ref: '#/components/examples/AmbiguousTargetExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid or ambiguous request parameters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  $ref: '#/components/examples/UnauthorizedExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The key or customer subscription is not active.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The cached monthly quota state is exceeded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-TimeLogic-Quota-State:
              $ref: '#/components/headers/XTimeLogicQuotaState'
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Only `GET` is supported.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "500":
          content:
            application/json:
              examples:
                internalError:
                  $ref: '#/components/examples/InternalErrorExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Internal server error, including signing failures."
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "501":
          content:
            application/json:
              examples:
                dependencyNotReady:
                  $ref: '#/components/examples/DependencyNotReadyExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A required resolver or dependency is not configured or not
            ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "502":
          content:
            application/json:
              examples:
                upstreamFailure:
                  $ref: '#/components/examples/UpstreamFailureExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway failed to forward the request to the core worker.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      summary: Get the current time for a target
      tags:
      - Time
      x-accepts:
      - application/json
  /v1/time/convert:
    get:
      description: |
        Converts one required input timestamp into a single target or a bulk array.

        Input timestamp forms:
        - `unix=1711300000`
        - `unix_ms=1711300000000`
        - `iso=2026-04-16T09:00:00Z`
        - `iso=2026-04-16T09:00:00&source_tz=America/New_York`
        - `iso=2026-04-16T09:00:00&source_ip=8.8.8.8`
        - `iso=2026-04-16T09:00:00&source_lat=40.7128&source_lon=-74.0060`
        - `iso=2026-04-16T09:00:00&source_offset=-05:00`

        Target selector forms:
        - `tz=America/New_York`
        - `ip=8.8.8.8`
        - `lat=40.7128&lon=-74.0060`
        - `offset=-04:00`
        - `auto_tz=true`
        - `utc=true`

        Incompatible combinations:
        - exactly one input timestamp form
        - exactly one target selector family
        - use at most one of `source_tz`, `source_ip`, `source_lat`/`source_lon`, or `source_offset`
        - local-ISO companion selectors are valid only with `iso=...` that has no explicit offset
        - bulk is allowed only through one comma-separated `tz`, `ip`, or `offset` selector

        Examples:
        - Single target: `/v1/time/convert?iso=2026-04-16T09:00:00&source_tz=America/New_York&tz=Europe/London`
        - Bulk target set: `/v1/time/convert?unix=1711300000&offset=-04:00,+00:00,+09:00`
      operationId: convertTime
      parameters:
      - example: 1711300000
        explode: true
        in: query
        name: unix
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - example: 1711300000000
        explode: true
        in: query
        name: unix_ms
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: "ISO-8601 timestamp. To supply a local wall-clock time without\
          \ an explicit offset, pair it with one of `source_tz=Area/City`, `source_ip=...`,\
          \ `source_lat=...&source_lon=...`, or `source_offset=±HH:MM`."
        example: 2024-03-24T15:00:00
        explode: true
        in: query
        name: iso
        required: false
        schema:
          type: string
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
        example: America/New_York
        explode: true
        in: query
        name: source_tz
        required: false
        schema:
          type: string
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Resolves that local wall-clock time through the timezone mapped from this
          IP address.
        example: 8.8.8.8
        explode: true
        in: query
        name: source_ip
        required: false
        schema:
          type: string
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Provide together with `source_lon` to resolve that local wall-clock time
          through the timezone mapped from these coordinates.
        example: 40.7128
        explode: true
        in: query
        name: source_lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Provide together with `source_lat`.
        example: -74.006
        explode: true
        in: query
        name: source_lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Interprets that local wall-clock time at this fixed UTC offset.
        example: -05:00
        explode: true
        in: query
        name: source_offset
        required: false
        schema:
          pattern: "^[+-](0\\d|1\\d|2[0-3]):[0-5]\\d$"
          type: string
        style: form
      - description: "IANA timezone name. On bulk-capable routes, a comma-separated\
          \ list enables bulk mode."
        example: America/New_York
        explode: true
        in: query
        name: tz
        required: false
        schema:
          maxLength: 64
          type: string
        style: form
      - description: "IP address. On bulk-capable routes, a comma-separated list enables\
          \ bulk mode."
        example: 8.8.8.8
        explode: true
        in: query
        name: ip
        required: false
        schema:
          type: string
        style: form
      - description: Latitude. Must be provided together with `lon`.
        example: 40.7128
        explode: true
        in: query
        name: lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
        style: form
      - description: Longitude. Must be provided together with `lat`.
        example: -74.006
        explode: true
        in: query
        name: lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
        style: form
      - description: "Fixed UTC offset in `+HH:MM` or `-HH:MM` format. On bulk-capable\
          \ routes, a comma-separated list enables bulk mode."
        example: -04:00
        explode: true
        in: query
        name: offset
        required: false
        schema:
          pattern: "^[+-](0\\d|1\\d|2[0-3]):[0-5]\\d$"
          type: string
        style: form
      - description: Set to `true` to resolve using the caller IP from Cloudflare
          headers.
        example: true
        explode: true
        in: query
        name: auto_tz
        required: false
        schema:
          type: boolean
        style: form
      - description: Set to `true` to force UTC on routes that support it.
        example: true
        explode: true
        in: query
        name: utc
        required: false
        schema:
          type: boolean
        style: form
      - description: "Custom date/time format template using supported `strftime`-style\
          \ directives such as `%Y-%m-%d %H:%M:%S`. Reference: [strftime](https://strftime.net/)."
        example: '%Y-%m-%d %H:%M:%S'
        explode: true
        in: query
        name: format
        required: false
        schema:
          type: string
        style: form
      - description: "Set to exactly `true` to ask the gateway to sign the final JSON\
          \ response. Every authenticated JSON response, including errors, then includes\
          \ signing headers. Not supported on `/v1/time/clock`."
        example: true
        explode: true
        in: query
        name: sign
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                singleTarget:
                  $ref: '#/components/examples/ConvertSingleExample'
                bulkByOffset:
                  $ref: '#/components/examples/ConvertBulkExample'
                bulkPartialFailure:
                  $ref: '#/components/examples/ConvertBulkPartialFailureExample'
              schema:
                $ref: '#/components/schemas/getCurrentTime_200_response'
          description: Converted time payload or bulk array.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-TimeLogic-Signature:
              $ref: '#/components/headers/XTimeLogicSignature'
            X-TimeLogic-Key-Id:
              $ref: '#/components/headers/XTimeLogicKeyId'
            X-TimeLogic-Signature-Alg:
              $ref: '#/components/headers/XTimeLogicSignatureAlg'
            X-TimeLogic-Signature-Timestamp:
              $ref: '#/components/headers/XTimeLogicSignatureTimestamp'
            X-TimeLogic-Content-SHA256:
              $ref: '#/components/headers/XTimeLogicContentSha256'
            X-TimeLogic-Signature-Input:
              $ref: '#/components/headers/XTimeLogicSignatureInput'
        "400":
          content:
            application/json:
              examples:
                invalidParameter:
                  $ref: '#/components/examples/InvalidParameterExample'
                ambiguousTarget:
                  $ref: '#/components/examples/AmbiguousTargetExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid or ambiguous request parameters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  $ref: '#/components/examples/UnauthorizedExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The key or customer subscription is not active.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The cached monthly quota state is exceeded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-TimeLogic-Quota-State:
              $ref: '#/components/headers/XTimeLogicQuotaState'
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Only `GET` is supported.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "500":
          content:
            application/json:
              examples:
                internalError:
                  $ref: '#/components/examples/InternalErrorExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Internal server error, including signing failures."
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "501":
          content:
            application/json:
              examples:
                dependencyNotReady:
                  $ref: '#/components/examples/DependencyNotReadyExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A required resolver or dependency is not configured or not
            ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "502":
          content:
            application/json:
              examples:
                upstreamFailure:
                  $ref: '#/components/examples/UpstreamFailureExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway failed to forward the request to the core worker.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      summary: Convert a timestamp into a target timezone or offset
      tags:
      - Time
      x-accepts:
      - application/json
  /v1/time/diff:
    get:
      description: |
        Computes the duration between `from` and `to`.

        Required query fields: `from` and `to` only. Do not send every optional companion field.
        For each side, choose one supported specifier form. A `from_*` or `to_*` companion is
        allowed only when that side uses `iso=...` with no explicit offset; use at most one
        companion selector, except that coordinate input requires its paired latitude and longitude.

        `from` and `to` are embedded specifier strings.

        Accepted specifier forms:
        - `from=now`
        - `from=unix=1711300000`
        - `from=unix_ms=1711300000000`
        - `from=iso=2026-04-16T09:00:00`
        - `from=tz=America/New_York`
        - `from=ip=8.8.8.8`
        - `from=offset=-05:00`
        - the same forms are accepted for `to`

        Timezone hint pairings:
        - `from_tz` only with `from=iso=...` that has no explicit offset
        - `from_ip`, `from_lat`/`from_lon`, and `from_offset` only with `from=iso=...` that has no explicit offset
        - `to_tz` only with `to=iso=...` that has no explicit offset
        - `to_ip`, `to_lat`/`to_lon`, and `to_offset` only with `to=iso=...` that has no explicit offset

        Selector semantics:
        - `tz=...`, `ip=...`, and `offset=...` inside `from` or `to` mean the current request-time instant resolved through that selector
        - those selector forms do not represent an arbitrary local wall-clock time
        - returned duration magnitudes are absolute; use `direction` to see whether `to` is after, before, or the same instant as `from`

        Business-day rules:
        - `holiday_country` and `holiday_subdivision` require `business_days=true`
        - `holiday_subdivision` also requires `holiday_country`

        Examples:
        - Selector-current instant: `/v1/time/diff?from=unix=1711300000&to=tz=America/New_York`
        - Wall-clock pairing: `/v1/time/diff?from=iso=2026-04-16T09:00:00&from_tz=America/New_York&to=iso=2026-04-16T09:00:00&to_tz=Europe/London`
        - Wall-clock via selector: `/v1/time/diff?from=iso=2026-01-01T12:00:00&from_ip=8.8.8.8&to=iso=2026-01-01T12:00:00&to_offset=-05:00`
      operationId: diffTime
      parameters:
      - description: "Time specifier. Supported forms are `now`, `unix=<seconds>`,\
          \ `unix_ms=<milliseconds>`, `iso=<ISO-8601>`, `offset=±HH:MM`, `tz=<IANA\
          \ timezone>`, and `ip=<IP address>`. For `tz=...`, `ip=...`, and `offset=...`,\
          \ the specifier means the current request-time instant resolved through\
          \ that selector. To express a local wall-clock time, use `from=iso=...`\
          \ together with one of `from_tz`, `from_ip`, `from_lat`+`from_lon`, or `from_offset`."
        explode: true
        in: query
        name: from
        required: true
        schema:
          type: string
        style: form
      - description: "Time specifier. Supported forms are `now`, `unix=<seconds>`,\
          \ `unix_ms=<milliseconds>`, `iso=<ISO-8601>`, `offset=±HH:MM`, `tz=<IANA\
          \ timezone>`, and `ip=<IP address>`. For `tz=...`, `ip=...`, and `offset=...`,\
          \ the specifier means the current request-time instant resolved through\
