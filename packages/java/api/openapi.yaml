  headers:
    XRequestId:
      description: Gateway-generated or forwarded request identifier.
      example: f3eb6ec5-77a8-454f-8b6a-5c68aabe7abb
      explode: false
      schema:
        type: string
      style: simple
    XTimeLogicSignature:
      description: Base64 Ed25519 detached signature for signed JSON responses.
      example: vbk1uI/2SaHwARiXyoZye4CG4OM4MG0NNqFfwZ4WzAQFdAYupZ0S6JT0KUzdc7/1PD5vtLLgQJFbM1+vUvD4CQ==
      explode: false
      schema:
        type: string
      style: simple
    XTimeLogicKeyId:
      description: Signing key identifier used for `X-TimeLogic-Signature`.
      example: ed25519-2026-07-19
      explode: false
      schema:
        type: string
      style: simple
    XTimeLogicSignatureAlg:
      description: Signature algorithm.
      example: Ed25519
      explode: false
      schema:
        enum:
        - Ed25519
        type: string
      style: simple
    XTimeLogicSignatureTimestamp:
      description: UNIX seconds used in the signing envelope.
      example: "1776274247"
      explode: false
      schema:
        pattern: ^-?\d+$
        type: string
      style: simple
    XTimeLogicSignatureInput:
      description: "Base64URL-encoded exact UTF-8 v1 signing input. Decode this value\
        \ and verify X-TimeLogic-Signature over the decoded bytes; it includes the\
        \ signed path and query, including sign=true, and deliberately excludes scheme,\
        \ host, and Content-Type."
      explode: false
      schema:
        type: string
      style: simple
    XTimeLogicCustomerId:
      description: Authenticated customer identifier.
      explode: false
      schema:
        type: string
      style: simple
    XTimeLogicPlan:
      description: Authenticated customer plan.
      explode: false
      schema:
        type: string
      style: simple
    XTimeLogicQuotaLimit:
      description: "Monthly quota limit, or unlimited."
      explode: false
      schema:
        type: string
      style: simple
    XTimeLogicQuotaState:
      description: Cached quota state.
      explode: false
      schema:
        enum:
        - active
        - exceeded
        type: string
      style: simple
    XTimeLogicContentSha256:
      description: Standard Base64 SHA-256 hash of the exact UTF-8 JSON response body
        bytes.
      example: bP2ZOTQo23TTmTlt3RkxPk82gAZ5GpeWogsxgOhRAkg=
      explode: false
      schema:
        type: string
      style: simple
