  /v1/time/clock:
    get:
      description: |
        Returns an embeddable HTML clock fragment.

        Input timestamp forms:
        - `unix=1711300000`
        - `unix_ms=1711300000000`
        - `iso=2026-04-16T09:00:00Z`
        - `iso=2026-04-16T09:00:00&source_tz=America/New_York`

        Target selector forms:
        - `tz=America/New_York`
        - `ip=8.8.8.8`
        - `lat=40.7128&lon=-74.0060`
        - `offset=-04:00`

        Incompatible combinations:
        - `style` is required and must be one of the 30 names in the `style` enum
        - at most one input timestamp form
        - at most one target selector family
        - use at most one of `source_tz`, `source_ip`, `source_lat`/`source_lon`, or `source_offset`
        - local-ISO companion selectors are valid only with `iso=...` that has no explicit offset
        - this route is single-target only; comma-separated `tz`, `ip`, and `offset` values are rejected
        - `auto_tz` is not supported on this route
        - `sign` is not supported on this route

        Examples:
        - Digital: `/v1/time/clock?style=digital-dashboard&iso=2026-04-16T09:00:00&source_tz=America/New_York&tz=Europe/London`
        - Analog: `/v1/time/clock?style=analog-station&offset=-04:00`
      operationId: getClock
      parameters:
      - description: Clock style name. Valid values are enumerated here; there is
          no separate style discovery endpoint.
        explode: true
        in: query
        name: style
        required: true
        schema:
          enum:
          - analog-station
          - analog-aviation
          - analog-bauhaus
          - analog-graphite
          - analog-arctic
          - analog-brass
          - analog-marine
          - analog-grid
          - analog-slate
          - analog-executive
          - digital-segment-red
          - digital-segment-amber
          - digital-segment-ice
          - digital-terminal-green
          - digital-terminal-white
          - digital-broadcast
          - digital-dashboard
          - digital-control-room
          - digital-slate
          - digital-onyx
          - digital-frost
          - digital-card
          - digital-glass
          - digital-matrix
          - digital-timetable
          - digital-split-flap
          - digital-cyan
          - digital-emerald
          - digital-monolith
          - digital-minimal
          type: string
        style: form
      - example: 1711300000
        explode: true
        in: query
        name: unix
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - example: 1711300000000
        explode: true
        in: query
        name: unix_ms
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: "ISO-8601 timestamp. To supply a local wall-clock time without\
          \ an explicit offset, pair it with one of `source_tz=Area/City`, `source_ip=...`,\
          \ `source_lat=...&source_lon=...`, or `source_offset=±HH:MM`."
        example: 2024-03-24T15:00:00
        explode: true
        in: query
        name: iso
        required: false
        schema:
          type: string
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
        example: America/New_York
        explode: true
        in: query
        name: source_tz
        required: false
        schema:
          type: string
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Resolves that local wall-clock time through the timezone mapped from this
          IP address.
        example: 8.8.8.8
        explode: true
        in: query
        name: source_ip
        required: false
        schema:
          type: string
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Provide together with `source_lon` to resolve that local wall-clock time
          through the timezone mapped from these coordinates.
        example: 40.7128
        explode: true
        in: query
        name: source_lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Provide together with `source_lat`.
        example: -74.006
        explode: true
        in: query
        name: source_lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
        style: form
      - description: Used only with `iso=...` when the ISO value has no explicit offset.
          Interprets that local wall-clock time at this fixed UTC offset.
        example: -05:00
        explode: true
        in: query
        name: source_offset
        required: false
        schema:
          pattern: "^[+-](0\\d|1\\d|2[0-3]):[0-5]\\d$"
          type: string
        style: form
      - description: "IANA timezone name. On bulk-capable routes, a comma-separated\
          \ list enables bulk mode."
        example: America/New_York
        explode: true
        in: query
        name: tz
        required: false
        schema:
          maxLength: 64
          type: string
        style: form
      - description: "IP address. On bulk-capable routes, a comma-separated list enables\
          \ bulk mode."
        example: 8.8.8.8
        explode: true
        in: query
        name: ip
        required: false
        schema:
          type: string
        style: form
      - description: Latitude. Must be provided together with `lon`.
        example: 40.7128
        explode: true
        in: query
        name: lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
        style: form
      - description: Longitude. Must be provided together with `lat`.
        example: -74.006
        explode: true
        in: query
        name: lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
        style: form
      - description: "Fixed UTC offset in `+HH:MM` or `-HH:MM` format. On bulk-capable\
          \ routes, a comma-separated list enables bulk mode."
        example: -04:00
        explode: true
        in: query
        name: offset
        required: false
        schema:
          pattern: "^[+-](0\\d|1\\d|2[0-3]):[0-5]\\d$"
          type: string
        style: form
      - description: "Custom date/time format template using supported `strftime`-style\
          \ directives such as `%Y-%m-%d %H:%M:%S`. Reference: [strftime](https://strftime.net/)."
        example: '%Y-%m-%d %H:%M:%S'
        explode: true
        in: query
        name: format
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/html:
              examples:
                digitalDashboard:
                  $ref: '#/components/examples/ClockDigitalHtmlExample'
                analogStation:
                  $ref: '#/components/examples/ClockAnalogHtmlExample'
              schema:
                type: string
          description: Embeddable HTML clock fragment.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              description: Clock HTML is uncached so the bootstrap always reflects
                the current request.
              example: no-store
              explode: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              examples:
                invalidStyle:
                  $ref: '#/components/examples/ClockInvalidStyleExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid clock style or unsupported selector combination.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  $ref: '#/components/examples/UnauthorizedExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The key or customer subscription is not active.
