    MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Only `GET` is supported.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    DependencyNotReady:
      content:
        application/json:
          examples:
            dependencyNotReady:
              $ref: '#/components/examples/DependencyNotReadyExample'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: A required resolver or dependency is not configured or not ready.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    InternalError:
      content:
        application/json:
          examples:
            internalError:
              $ref: '#/components/examples/InternalErrorExample'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: "Internal server error, including signing failures."
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    UpstreamFailure:
      content:
        application/json:
          examples:
            upstreamFailure:
              $ref: '#/components/examples/UpstreamFailureExample'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Gateway failed to forward the request to the core worker.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    SubscriptionInactive:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The key or customer subscription is not active.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    QuotaExceeded:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The cached monthly quota state is exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-TimeLogic-Quota-State:
          $ref: '#/components/headers/XTimeLogicQuotaState'
  schemas:
    ApiError:
      example:
        code: AMBIGUOUS_TARGET
        details: ""
        message: message
      properties:
        code:
          enum:
          - AMBIGUOUS_TARGET
          - MISSING_TARGET
          - INVALID_PARAMETER
          - INVALID_TIMESTAMP
          - DEPENDENCY_NOT_READY
          - SIGNING_NOT_READY
          - UNAUTHORIZED
          - INVALID_AUTH
          - METHOD_NOT_ALLOWED
          - NOT_FOUND
          - INTERNAL_ERROR
          - SUBSCRIPTION_INACTIVE
          - QUOTA_EXCEEDED
          type: string
        message:
          type: string
        details:
          description: Optional implementation-specific detail payload.
          nullable: true
      required:
      - code
      - message
      type: object
    ErrorResponse:
      example:
        error:
          code: AMBIGUOUS_TARGET
          details: ""
          message: message
        request_id: request_id
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        request_id:
          type: string
        timestamp:
          description: Intentionally omitted from public API error responses to avoid
            exposing request timing; use request_id for support correlation.
          format: date-time
          type: string
      required:
      - error
      - request_id
      type: object
    BulkError:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - properties:
          item:
            type: string
        required:
        - item
        type: object
      description: Per-item error wrapper used inside bulk arrays returned by bulk-capable
        routes.
    TimePayload:
      description: Canonical single-target time payload.
      example:
        unix_ms: 6
        utc: 2000-01-23T04:56:07.000+00:00
        day_full: day_full
        timezone: timezone
        formatted: formatted
        day_short: day_short
        day_number: 1
        rfc2822: rfc2822
        human: human
        unix: 0
        iso_local: iso_local
      properties:
        unix:
          format: int64
          type: integer
        unix_ms:
          format: int64
          type: integer
        utc:
          format: date-time
          type: string
        iso_local:
          nullable: true
          type: string
        rfc2822:
          type: string
        human:
          type: string
        day_number:
          maximum: 7
          minimum: 1
          type: integer
        day_short:
          type: string
        day_full:
          type: string
        timezone:
          nullable: true
          type: string
        formatted:
          type: string
      required:
      - day_full
      - day_number
      - day_short
      - human
      - iso_local
      - rfc2822
      - timezone
      - unix
      - unix_ms
      - utc
      title: Single time payload
      type: object
    TimePayloadBulkItem:
      description: "One bulk array item, either a successful time payload or a per-item\
        \ bulk error."
      oneOf:
      - $ref: '#/components/schemas/TimePayload'
      - $ref: '#/components/schemas/BulkError'
      title: Bulk time payload item
    TimePayloadBulkResponse:
      description: "Bulk response array returned when `/v1/time/current` or `/v1/time/convert`\
        \ receives one comma-separated `tz`, `ip`, or `offset` selector."
      items:
        $ref: '#/components/schemas/TimePayloadBulkItem'
      title: Bulk time payload array
      type: array
    DiffEndpointRef:
      description: Resolved endpoint reference for diff calculations. This object
        intentionally includes only the resolved epoch-millisecond instant.
      example:
        unix_ms: 2
      properties:
        unix_ms:
          format: int64
          type: integer
      required:
      - unix_ms
      type: object
    DiffResponse:
      example:
        business_days: 5
        seconds: 0
        hours: 1
        minutes: 6
        formatted: formatted
        days: 5
        from:
          unix_ms: 2
        to:
          unix_ms: 2
        human: human
        direction: forward
      properties:
        seconds:
          type: integer
        minutes:
          type: integer
        hours:
          type: integer
        days:
          type: integer
        direction:
          description: '`forward` means `to` is after `from`. `backward` means `to`
            is before `from`. `same` means both sides resolve to the same instant.'
          enum:
          - forward
          - backward
          - same
          type: string
        human:
          type: string
        formatted:
          type: string
        business_days:
          type: integer
        from:
          $ref: '#/components/schemas/DiffEndpointRef'
        to:
          $ref: '#/components/schemas/DiffEndpointRef'
      required:
      - days
      - direction
      - from
      - hours
      - human
      - minutes
      - seconds
      - to
      type: object
    CalendarResponse:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - properties:
          year:
            type: integer
          month:
            type: integer
          month_name:
            type: string
          day:
            type: integer
          week_number:
            type: integer
        required:
        - day
        - month
        - month_name
        - year
        type: object
      example:
        month_name: month_name
        utc: 2000-01-23T04:56:07.000+00:00
        day_full: day_full
        year: 5
        timezone: timezone
        formatted: formatted
        rfc2822: rfc2822
        unix_ms: 6
        month: 5
        day_short: day_short
        day_number: 1
        week_number: 7
        human: human
        day: 2
        unix: 0
        iso_local: iso_local
    DstResponse:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - properties:
          dst_active:
            type: boolean
          next_transition:
            format: date-time
            nullable: true
            type: string
        required:
        - dst_active
        type: object
      example:
        utc: 2000-01-23T04:56:07.000+00:00
        day_full: day_full
        timezone: timezone
        formatted: formatted
        rfc2822: rfc2822
        next_transition: 2000-01-23T04:56:07.000+00:00
        unix_ms: 6
        dst_active: true
        day_short: day_short
        day_number: 1
        human: human
        unix: 0
        iso_local: iso_local
    ElapsedResponse:
      example:
        business_days: 5
        seconds: 0
        hours: 1
        minutes: 6
        formatted: formatted
        days: 5
        human: human
        direction: left
      properties:
        seconds:
          type: integer
        minutes:
          type: integer
        hours:
          type: integer
        days:
          type: integer
        human:
          type: string
        direction:
          description: '`left` means the target instant is still in the future. `passed`
            means the target instant is already in the past.'
          enum:
          - left
          - passed
          type: string
        formatted:
          type: string
        business_days:
          type: integer
      required:
      - days
      - direction
      - hours
      - human
      - minutes
      - seconds
      type: object
    TimezoneResolvedResponse:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - properties:
          offset:
            type: integer
          dst:
            type: boolean
        required:
        - dst
        - offset
        type: object
      description: Standard single-target timezone resolution payload.
      example:
        offset: 5
        dst: true
        utc: 2000-01-23T04:56:07.000+00:00
        day_full: day_full
        timezone: timezone
        formatted: formatted
        rfc2822: rfc2822
        unix_ms: 6
        day_short: day_short
        day_number: 1
        human: human
        unix: 0
        iso_local: iso_local
      title: Resolved timezone response
    TimezoneMatch:
      allOf:
      - $ref: '#/components/schemas/TimePayload'
      - properties:
          offset:
            type: integer
          dst:
            type: boolean
          timezone:
            type: string
        required:
        - dst
        - offset
        - timezone
        type: object
    TimezoneOffsetResponse:
      allOf:
      - $ref: '#/components/schemas/TimezoneResolvedResponse'
      - properties:
          timezone:
            nullable: true
            type: string
          matching_zones:
            items:
              $ref: '#/components/schemas/TimezoneMatch'
            type: array
        required:
        - matching_zones
        type: object
      description: Offset-based timezone lookup result with `matching_zones` for the
        current request-time offset match.
      title: Offset match response
    JwkKey:
      example:
        kty: OKP
        crv: Ed25519
        use: sig
        kid: ed25519-2026-07-19
        x: x
        alg: EdDSA
      properties:
        kty:
          enum:
          - OKP
          type: string
        crv:
          enum:
          - Ed25519
          type: string
        alg:
          enum:
          - EdDSA
          type: string
        use:
          enum:
          - sig
          type: string
        kid:
          example: ed25519-2026-07-19
          type: string
        x:
          type: string
      required:
      - alg
      - crv
      - kid
      - kty
      - use
      - x
      type: object
    JwksResponse:
      example:
        keys:
        - kty: OKP
          crv: Ed25519
          use: sig
          kid: ed25519-2026-07-19
          x: x
          alg: EdDSA
        - kty: OKP
          crv: Ed25519
          use: sig
          kid: ed25519-2026-07-19
          x: x
          alg: EdDSA
      properties:
        keys:
          items:
            $ref: '#/components/schemas/JwkKey'
          type: array
      required:
      - keys
      type: object
    getCurrentTime_200_response:
      oneOf:
      - $ref: '#/components/schemas/TimePayload'
      - $ref: '#/components/schemas/TimePayloadBulkResponse'
    getTimezone_200_response:
      oneOf:
      - $ref: '#/components/schemas/TimezoneResolvedResponse'
      - $ref: '#/components/schemas/TimezoneOffsetResponse'
  securitySchemes:
    bearerAuth:
      bearerFormat: TimeLogic API key
      description: "API key supplied as Authorization: Bearer."
      scheme: bearer
      type: http
    apiKeyHeader:
      description: API key supplied as X-API-Key.
      in: header
      name: X-API-Key
      type: apiKey
    apiKeyQuery:
      description: API key supplied as a query parameter; headers are preferred.
      in: query
      name: api_key
      type: apiKey
    rapidApiKey:
      description: RapidAPI subscription key. The SDK rapidApi option accepts this
        key.
      in: header
      name: X-RapidAPI-Key
      type: apiKey
    rapidApiHost:
      description: RapidAPI gateway host header. SDKs supply the configured host automatically.
      in: header
      name: X-RapidAPI-Host
      type: apiKey

