  /v1/timezone:
    get:
      description: |-
        Resolves timezone metadata for a single target.

        Target selector rules:
        - Use exactly one selector family: `tz`, `ip`, `lat` + `lon`, `offset`, or `auto_tz=true`.
        - Bulk is not supported on this route.
        - `offset` queries return a specialized payload that includes `matching_zones` for the request-time offset match.

        Examples:
        - Single target: `/v1/timezone?tz=America/New_York`
        - Offset match: `/v1/timezone?offset=-04:00`
      operationId: getTimezone
      parameters:
      - description: "IANA timezone name. On bulk-capable routes, a comma-separated\
          \ list enables bulk mode."
        example: America/New_York
        explode: true
        in: query
        name: tz
        required: false
        schema:
          maxLength: 64
          type: string
        style: form
      - description: "IP address. On bulk-capable routes, a comma-separated list enables\
          \ bulk mode."
        example: 8.8.8.8
        explode: true
        in: query
        name: ip
        required: false
        schema:
          type: string
        style: form
      - description: Latitude. Must be provided together with `lon`.
        example: 40.7128
        explode: true
        in: query
        name: lat
        required: false
        schema:
          format: double
          maximum: 90
          minimum: -90
          type: number
        style: form
      - description: Longitude. Must be provided together with `lat`.
        example: -74.006
        explode: true
        in: query
        name: lon
        required: false
        schema:
          format: double
          maximum: 180
          minimum: -180
          type: number
        style: form
      - description: "Fixed UTC offset in `+HH:MM` or `-HH:MM` format. On bulk-capable\
          \ routes, a comma-separated list enables bulk mode."
        example: -04:00
        explode: true
        in: query
        name: offset
        required: false
        schema:
          pattern: "^[+-](0\\d|1\\d|2[0-3]):[0-5]\\d$"
          type: string
        style: form
      - description: Set to `true` to resolve using the caller IP from Cloudflare
          headers.
        example: true
        explode: true
        in: query
        name: auto_tz
        required: false
        schema:
          type: boolean
        style: form
      - description: "Set to exactly `true` to ask the gateway to sign the final JSON\
          \ response. Every authenticated JSON response, including errors, then includes\
          \ signing headers. Not supported on `/v1/time/clock`."
        example: true
        explode: true
        in: query
        name: sign
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                resolvedTimezone:
                  $ref: '#/components/examples/TimezoneResolvedExample'
                offsetMatches:
                  $ref: '#/components/examples/TimezoneOffsetExample'
              schema:
                $ref: '#/components/schemas/getTimezone_200_response'
          description: Resolved timezone payload.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-TimeLogic-Signature:
              $ref: '#/components/headers/XTimeLogicSignature'
            X-TimeLogic-Key-Id:
              $ref: '#/components/headers/XTimeLogicKeyId'
            X-TimeLogic-Signature-Alg:
              $ref: '#/components/headers/XTimeLogicSignatureAlg'
            X-TimeLogic-Signature-Timestamp:
              $ref: '#/components/headers/XTimeLogicSignatureTimestamp'
            X-TimeLogic-Content-SHA256:
              $ref: '#/components/headers/XTimeLogicContentSha256'
            X-TimeLogic-Signature-Input:
              $ref: '#/components/headers/XTimeLogicSignatureInput'
        "400":
          content:
            application/json:
              examples:
                invalidParameter:
                  $ref: '#/components/examples/InvalidParameterExample'
                ambiguousTarget:
                  $ref: '#/components/examples/AmbiguousTargetExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid or ambiguous request parameters.
          headers:
